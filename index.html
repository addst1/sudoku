<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>스도쿠</title>
  <meta name="description" content="오프라인에서도 즐기는 스도쿠 게임">
  <meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f121a" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="스도쿠">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">

    <!-- 홈 -->
    <section id="screen-home" class="screen">
      <button id="btn-theme-quick" class="icon-btn theme-quick" type="button" aria-label="라이트/다크 전환">
        <svg id="ico-theme" viewBox="0 0 24 24" aria-hidden="true"></svg>
      </button>
      <div class="hero">
        <img src="icons/icon.svg" alt="" width="76" height="76">
        <h1>스도쿠</h1>
        <p>오프라인에서도 즐기는 숫자 퍼즐</p>
      </div>

      <button id="btn-continue" class="btn primary wide" type="button" hidden>
        <span>이어하기</span>
        <small id="continue-info"></small>
      </button>

      <h2 class="section-title">새 게임</h2>
      <div class="diff-list">
        <button class="diff" type="button" data-diff="easy">
          <b>쉬움</b><span>단서가 많은 입문용</span><em data-best="easy"></em>
        </button>
        <button class="diff" type="button" data-diff="medium">
          <b>보통</b><span>차분히 추리하면 풀려요</span><em data-best="medium"></em>
        </button>
        <button class="diff" type="button" data-diff="hard">
          <b>어려움</b><span>고급 기술이 필요해요</span><em data-best="hard"></em>
        </button>
      </div>

      <div class="home-actions">
        <button id="btn-stats" class="btn" type="button">기록</button>
        <button id="btn-settings" class="btn" type="button">설정</button>
      </div>

      <div id="install-box" class="install" hidden>
        <p id="install-text">홈 화면에 설치하면 앱처럼 쓸 수 있어요.</p>
        <button id="btn-install" class="btn primary" type="button" hidden>설치</button>
      </div>
    </section>

    <!-- 게임 -->
    <section id="screen-game" class="screen" hidden>
      <header class="topbar">
        <button id="btn-back" class="icon-btn" type="button" aria-label="메뉴로 나가기">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <span class="top-spacer"></span>
        <button id="btn-game-settings" class="icon-btn" type="button" aria-label="설정">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </header>

      <div class="infobar">
        <strong id="g-diff">보통</strong>
        <div class="clock"><span id="g-time" aria-label="경과 시간">00:00</span>
        <button id="btn-pause" class="icon-btn" type="button" aria-label="일시정지">
          <svg id="ico-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
        </button>
        </div>
        <div id="g-lives" class="lives" role="img" aria-label="남은 하트"></div>
      </div>

      <div class="board-wrap">
        <div id="board" role="group" aria-label="스도쿠 판"></div>
        <div id="pause-overlay" hidden>
          <p>일시정지</p>
          <button id="btn-resume" class="btn primary" type="button">계속하기</button>
        </div>
      </div>

      <div class="tools">
        <button id="btn-undo" class="tool" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
          <span>되돌리기</span>
        </button>
        <button id="btn-redo" class="tool" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
          <span>다시 실행</span>
        </button>
        <button id="btn-erase" class="tool" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>
          <span>지우기</span>
        </button>
        <button id="btn-hint" class="tool" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg>
          <span>힌트</span>
          <i id="hint-count" class="badge">0</i>
        </button>
        <button id="btn-notes" class="tool" type="button" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>
          <span>메모</span>
          <i id="notes-state" class="badge">끔</i>
        </button>
      </div>

      <label class="fast-row">
        <span><small id="fast-hint">판이나 아래 숫자를 고른 뒤 빈 칸을 누르면 입력돼요</small></span>
        <b class="fast-label">빠른 입력</b>
        <input type="checkbox" id="btn-fast" role="switch">
      </label>

      <div id="numpad" class="numpad"></div>
    </section>
  </main>

  <!-- 기록 -->
  <dialog id="dlg-stats">
    <form method="dialog">
      <h2>기록</h2>
      <div id="stats-body"></div>
      <div class="dlg-actions">
        <button type="button" id="btn-reset-stats" class="btn danger">기록 초기화</button>
        <button class="btn primary" value="close">닫기</button>
      </div>
    </form>
  </dialog>

  <!-- 설정 -->
  <dialog id="dlg-settings">
    <form method="dialog">
      <h2>설정</h2>
      <div class="row">
        <span>하트 수<small>틀리면 하나씩 줄고, 모두 잃으면 게임 오버예요. 새 게임부터 적용돼요.</small></span>
        <div class="stepper">
          <button type="button" id="lives-dec" aria-label="하트 줄이기">−</button>
          <output id="lives-val" aria-live="polite">3</output>
          <button type="button" id="lives-inc" aria-label="하트 늘리기">+</button>
        </div>
      </div>
      <label class="row">
        <span>오류 표시<small>틀린 숫자를 빨간색으로 보여줘요</small></span>
        <input type="checkbox" id="set-errors" role="switch">
      </label>
      <label class="row">
        <span>같은 줄·같은 숫자 강조<small>선택한 칸과 관련된 칸을 표시해요</small></span>
        <input type="checkbox" id="set-highlight" role="switch">
      </label>
      <label class="row">
        <span>축하 효과<small>줄·블록·전체를 완성하면 폭죽이 터져요</small></span>
        <input type="checkbox" id="set-celebrate" role="switch">
      </label>
      <div class="row">
        <span>테마</span>
        <div class="seg" id="set-theme" role="group" aria-label="테마">
          <button type="button" data-theme-value="auto">자동</button>
          <button type="button" data-theme-value="light">라이트</button>
          <button type="button" data-theme-value="dark">다크</button>
        </div>
      </div>
      <div class="dlg-actions">
        <button class="btn primary" value="close">닫기</button>
      </div>
      <p class="app-info" id="app-info"></p>
    </form>
  </dialog>

  <!-- 완료 -->
  <dialog id="dlg-win">
    <form method="dialog">
      <div class="win-emoji" aria-hidden="true">🎉</div>
      <h2>완성했어요!</h2>
      <p id="win-summary"></p>
      <div class="dlg-actions col">
        <button type="button" class="btn primary" id="btn-win-again">한 판 더</button>
        <button type="button" class="btn" id="btn-win-menu">메뉴로</button>
      </div>
    </form>
  </dialog>

  <!-- 게임 오버 -->
  <dialog id="dlg-over">
    <form method="dialog">
      <div class="win-emoji" aria-hidden="true">💔</div>
      <h2>게임 오버</h2>
      <p id="over-summary"></p>
      <div class="dlg-actions col">
        <button type="button" class="btn primary" id="btn-over-retry">같은 퍼즐 다시 도전</button>
        <button type="button" class="btn" id="btn-over-new">새 게임</button>
        <button type="button" class="btn" id="btn-over-menu">메뉴로</button>
      </div>
    </form>
  </dialog>

  <!-- 확인 -->
  <dialog id="dlg-confirm">
    <form method="dialog">
      <p id="confirm-msg"></p>
      <div class="dlg-actions">
        <button class="btn" value="cancel">취소</button>
        <button class="btn primary" value="ok" id="confirm-ok">확인</button>
      </div>
    </form>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>
  <div id="busy" hidden><div class="spinner" aria-hidden="true"></div><p>퍼즐을 만드는 중…</p></div>
  <div id="update-bar" hidden>
    <span>새 버전이 있어요.</span>
    <button id="btn-update" type="button">업데이트</button>
  </div>

  <script src="version.js"></script>
  <script src="fx.js"></script>
  <script src="sudoku.js"></script>
  <script src="app.js"></script>
</body>
</html>
